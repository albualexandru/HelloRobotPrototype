services:
  - type: web
    name: hello-robot-prototype
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash-live-001
